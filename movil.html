<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Impulse Fit</title>
<!-- PWA / iOS: mismo mecanismo que fittrainfitnessclub.wstudio.app (manifest + apple-touch-icon + web-app-capable) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Impulse Fit">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --label:#000; --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12);
    --glass:rgba(249,249,249,.8); --brand:#0E9F8E; --brand-text:#0B7F72; --brand-tint:rgba(14,159,142,.14);
    --green:#34C759; --red:#FF383C; --orange:#FF8D28; --blue:#0088FF;
    --green-tint:rgba(52,199,89,.16); --red-tint:rgba(255,56,60,.14); --orange-tint:rgba(255,141,40,.16); --blue-tint:rgba(0,136,255,.14);
    --status-fill:rgba(120,120,128,.16); --status-ink:rgba(60,60,67,.72);
    --indigo:#6155F5; --teal:#00C3D0; --pinares:#2E7D32;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000; --card:#1C1C1E; --label:#fff; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.24);
      --glass:rgba(30,30,30,.76); --brand:#2DBFAC; --brand-text:#3FD0BC; --brand-tint:rgba(45,191,172,.18);
      --green:#30D158; --red:#FF4245; --orange:#FF9230; --blue:#0091FF;
      --status-fill:rgba(120,120,128,.28); --status-ink:rgba(235,235,245,.72); --indigo:#6D7CFF; --teal:#00D2E0; --pinares:#4CAF50;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit}
  .safe-top{padding-top:env(safe-area-inset-top)}
  .num{font-variant-numeric:tabular-nums}

  /* ── Login ── */
  #login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);gap:14px;max-width:420px;margin:0 auto}
  #login .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 8px;display:block}
  #login h1{font-size:28px;font-weight:700;letter-spacing:-.02em;text-align:center;margin:0}
  #login p{margin:0 0 10px;text-align:center;color:var(--sec);font-size:15px}
  .field{background:var(--card);border-radius:12px;padding:0 16px;min-height:50px;display:flex;align-items:center}
  .field input{flex:1;border:0;background:transparent;color:var(--label);outline:none;min-height:50px;font-size:17px}
  .field input::placeholder{color:var(--ter)}
  .btn{min-height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;width:100%}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:disabled{opacity:.6}
  .btn.plain{background:var(--fill);color:var(--label)}
  .btn.link{color:var(--brand-text);min-height:44px}
  .err{color:var(--red);font-size:14px;min-height:18px;text-align:center}

  /* ── App shell ── */
  #app{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
  .nav{padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;background:var(--bg);z-index:3}
  .nav .row{display:flex;justify-content:space-between;align-items:center;min-height:32px;gap:10px}
  .nav .lt{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .nav .tt{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav .st{font-size:13px;color:var(--sec)}
  .nav .back{color:var(--brand-text);display:flex;align-items:center;gap:2px;min-height:44px;font-size:17px}
  .nav .back svg{width:12px;height:20px}
  .nav .act{color:var(--brand-text);font-weight:600;min-height:44px;display:flex;align-items:center}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
  .seg button{min-height:36px;border-radius:8px;font-size:14px;font-weight:600;color:var(--label)}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .datebox{display:flex;align-items:center;gap:10px}
  .datebox input{flex:1;min-height:40px;border:0;border-radius:10px;background:var(--card);color:var(--label);padding:0 12px;font-size:16px}

  main{display:flex;flex-direction:column;gap:22px;padding-top:6px}
  .sect{display:flex;flex-direction:column;gap:6px}
  .sect .hdr{padding:0 32px;font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.04em}
  .sect .ftr{padding:0 32px;font-size:13px;color:var(--sec)}
  .group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
  .cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;text-align:left;width:100%}
  .cell + .cell::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
  .cell.ico + .cell.ico::before{left:58px}
  .cell:active{background:var(--fill)}
  .cell .ic{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
  .cell .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .cell .t{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .s{font-size:13px;color:var(--sec)}
  .cell .v{font-size:17px;color:var(--sec);white-space:nowrap}
  .cell .v.strong{color:var(--label);font-weight:600}
  .cell .v.pos{color:var(--green)} .cell .v.neg{color:var(--red)}
  .chev{width:8px;height:14px;flex:none;stroke:var(--ter);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.ok{background:var(--green-tint);color:var(--green)} .pill.bad{background:var(--red-tint);color:var(--red)}
  .pill.warn{background:var(--orange-tint);color:var(--orange)} .pill.info{background:var(--blue-tint);color:var(--blue)}
  .pill.status{background:var(--status-fill);color:var(--status-ink)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .live .dot{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
  .tiles{margin:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
  .tile .l{font-size:13px;color:var(--sec)}
  .tile .n{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .tile .n small{font-size:14px;font-weight:600;color:var(--sec);margin-right:2px}
  .tile.wide .n{font-size:26px}
  .chips{margin:0 16px;display:flex;flex-wrap:wrap;gap:8px}
  .empty{margin:0 16px;padding:28px 16px;text-align:center;color:var(--sec);font-size:15px;background:var(--card);border-radius:12px}
  .foto{margin:8px 16px 0;border-radius:12px;overflow:hidden;background:var(--card)}
  .foto img{display:block;width:100%;max-height:360px;object-fit:contain;background:#000}
  .skel{height:44px;margin:0 16px;border-radius:12px;background:var(--card);opacity:.6}

  /* ── Tab bar flotante (Liquid Glass) ── */
  .tabbar{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:64px;padding:6px;background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
    border:.5px solid var(--sep);border-radius:32px;box-shadow:0 10px 30px -6px rgba(0,0,0,.22);display:grid;grid-template-columns:1fr 1fr;z-index:5}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--sec);border-radius:26px;min-height:44px}
  .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--brand-text);background:var(--brand-tint)}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--label);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;text-align:center;z-index:6;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:.95}
</style>
</head>
<body>

<div id="login">
  <img class="logo" src="/icons/icon-192.png" alt="">
  <h1>Impulse Fit</h1>
  <p>Validación rápida de caja desde tu celular</p>
  <div class="field"><input id="lEmail" type="email" placeholder="Correo" autocomplete="username" inputmode="email" autocapitalize="none"></div>
  <div class="field"><input id="lPass" type="password" placeholder="Contraseña" autocomplete="current-password"></div>
  <div class="err" id="lErr"></div>
  <button class="btn primary" id="lBtn" onclick="doLogin()">Entrar</button>
  <p style="font-size:12px;margin-top:6px">La sesión queda guardada en este teléfono hasta que cierres sesión.</p>
</div>

<div id="app" hidden>
  <header class="nav" id="nav"></header>
  <main id="view"></main>
  <nav class="tabbar">
    <button class="tab on" id="tabSedes" onclick="goSedes()"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Sedes</button>
    <button class="tab" id="tabCuenta" onclick="goCuenta()"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Cuenta</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL='__SUPA_URL__', SUPA_KEY='__SUPA_KEY__';
const APP_VER='2026-09-10a';
const SEDES=['3 Ríos','Natación','Pinares','Sabanilla'];
const SEDE_COLOR={'3 Ríos':'var(--teal)','Natación':'var(--blue)','Pinares':'var(--pinares)','Sabanilla':'var(--indigo)'};
const ROLES_PERMITIDOS=['recepcion','admin_sucursal','admin_sedes','admin_g','admin'];
const AUTH_KEY='impulseMovilAuth';
let auth=null;            // {access_token, refresh_token, expires_at, user_id, email}
let me=null;              // {role,nombre,sede,sedes_extra}
let selDate=todayStr();   // fecha seleccionada (local)
let cierres=[];           // cierres del día seleccionado (todas las sedes visibles por RLS)
let view='sedes', detSede=null, detTurnoId=null, pollTimer=null;

const fmt=n=>'₡'+Math.round(Number(n)||0).toLocaleString('es-CR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function todayStr(){return ymd(new Date());}
function ayerStr(){const d=new Date();d.setDate(d.getDate()-1);return ymd(d);}
const hora=iso=>iso?new Date(iso).toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'}):'—';
const fechaLarga=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'}).replace(/^\w/,c=>c.toUpperCase());};
const esAdmin=()=>['admin','admin_sedes','admin_g'].includes(me?.role);
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}

// ── Sesión persistente (el PWA se abre como app: no pedir login cada vez) ──
function saveAuth(a){auth=a;try{localStorage.setItem(AUTH_KEY,JSON.stringify(a));}catch(_){}}
function clearAuth(){auth=null;me=null;try{localStorage.removeItem(AUTH_KEY);}catch(_){}}
async function supaFetch(path,opts={}){
  const res=await fetch(SUPA_URL+'/rest/v1'+path,{method:opts.method||'GET',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+(auth?.access_token||SUPA_KEY),'Content-Type':'application/json','Prefer':opts.prefer||'return=minimal'},body:opts.body!=null?JSON.stringify(opts.body):undefined});
  if(res.status===401&&auth?.refresh_token&&!opts._retry){ if(await refreshSession()) return supaFetch(path,{...opts,_retry:true}); }
  if(!res.ok){const t=await res.text();throw new Error(t||('HTTP '+res.status));} const txt=await res.text(); return txt?JSON.parse(txt):null;
}
async function refreshSession(){
  try{
    const res=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:auth.refresh_token})});
    const d=await res.json(); if(!d.access_token) return false;
    saveAuth({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,user_id:d.user?.id||auth.user_id,email:d.user?.email||auth.email}); return true;
  }catch(_){return false;}
}
async function loadMe(){
  const rows=await supaFetch(`/user_roles?id=eq.${auth.user_id}&select=role,nombre,sede,sedes_extra`);
  me=rows?.[0]||null;
  if(!me||!ROLES_PERMITIDOS.includes(me.role)) throw new Error('Su cuenta no tiene acceso a este módulo.');
}
async function doLogin(){
  const email=document.getElementById('lEmail').value.trim(), pwd=document.getElementById('lPass').value, err=document.getElementById('lErr'), btn=document.getElementById('lBtn');
  if(!email||!pwd){err.textContent='Complete correo y contraseña.';return;}
  btn.disabled=true;btn.textContent='Ingresando…';err.textContent='';
  try{
    const res=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
    const d=await res.json(); if(!d.access_token) throw new Error(d.error_description||d.msg||'Credenciales incorrectas');
    saveAuth({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,user_id:d.user.id,email});
    await loadMe(); enterApp();
  }catch(e){clearAuth();err.textContent=e.message;}
  finally{btn.disabled=false;btn.textContent='Entrar';}
}
async function doLogout(){
  stopPoll();
  try{await fetch(`${SUPA_URL}/auth/v1/logout`,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+(auth?.access_token||'')}});}catch(_){}
  clearAuth(); document.getElementById('app').hidden=true; document.getElementById('login').hidden=false;
}
async function boot(){
  try{auth=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');}catch(_){auth=null;}
  if(auth?.refresh_token){
    const ok=await refreshSession();
    if(ok){ try{ await loadMe(); enterApp(); return; }catch(_){ } }
    clearAuth();
  }
  document.getElementById('login').hidden=false;
}
function enterApp(){ document.getElementById('login').hidden=true; document.getElementById('app').hidden=false; goSedes(); }

// ── Datos ──
async function loadDia(){
  const sel=['id','sede','fecha','turno_num','estado','hora_apertura','hora_cierre','caja_inicial','efectivo','efectivo_final','total_ventas','total_tarjeta','total_sinpe','total_transferencia','total_gastos','total_ingresos','minita','otros_vendidos','diferencia','estado_dif','sobre_modo','gastos','ingresos','sinpe_reporte','inventario_cierre','foto_datafono','foto_cierre','foto_analisis','updated_at','created_by'].join(',');
  cierres=(await supaFetch(`/cierres_caja?fecha=eq.${selDate}&order=sede.asc,turno_num.asc&select=${sel}`))||[];
}
const sedesVisibles=()=>{ if(esAdmin()) return SEDES; const set=[me?.sede,...(Array.isArray(me?.sedes_extra)?me.sedes_extra:[])].filter(s=>s&&SEDES.includes(s)); return [...new Set(set)]; };
const turnosDe=s=>cierres.filter(c=>c.sede===s).sort((a,b)=>(a.turno_num||0)-(b.turno_num||0));
function difInfo(c){ const d=Math.round(Number(c?.diferencia)||0); if(!c) return null; if(d===0) return {cls:'ok',txt:'Cuadra'}; if(d>0) return {cls:'bad',txt:'Faltante '+fmt(d)}; return {cls:'info',txt:'Sobrante '+fmt(-d)}; }
function estadoPill(c){ if(!c) return '<span class="pill warn">Sin turno</span>'; if(c.estado==='abierto') return '<span class="pill status live"><span class="dot"></span>Abierto '+hora(c.hora_apertura)+'</span>'; if(c.estado==='parcial') return '<span class="pill status">Parcial '+hora(c.hora_cierre)+'</span>'; return '<span class="pill status">Final '+hora(c.hora_cierre)+'</span>'; }

// ── Live (solo para hoy y con la app visible) ──
function startPoll(){ stopPoll(); if(selDate!==todayStr()) return; pollTimer=setInterval(async()=>{ if(document.visibilityState!=='visible') return; try{ await loadDia(); if(view==='sedes') renderSedes(false); else if(view==='detalle') renderDetalle(false); }catch(_){} },20000); }
function stopPoll(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&auth&&view!=='cuenta'){ (view==='sedes'?renderSedes:renderDetalle)(true); } });

// ── Navegación ──
function setTabs(on){ document.getElementById('tabSedes').classList.toggle('on',on==='sedes'); document.getElementById('tabCuenta').classList.toggle('on',on==='cuenta'); }
async function goSedes(){ view='sedes'; setTabs('sedes'); await renderSedes(true); startPoll(); window.scrollTo(0,0); }
async function goDetalle(sede,turnoId){ view='detalle'; detSede=sede; detTurnoId=turnoId||null; setTabs('sedes'); await renderDetalle(true); startPoll(); window.scrollTo(0,0); }
function goCuenta(){ view='cuenta'; stopPoll(); setTabs('cuenta'); renderCuenta(); window.scrollTo(0,0); }
function setFecha(f){ selDate=f; if(view==='detalle') goDetalle(detSede); else goSedes(); }

// ── Render: Sedes ──
function navSedes(){
  const hoy=selDate===todayStr(), ayer=selDate===ayerStr();
  document.getElementById('nav').innerHTML=`
    <div class="row"><span class="st">${esc(fechaLarga(selDate))}</span>${hoy?'<span class="pill ok live"><span class="dot"></span>En vivo</span>':'<span class="pill status">Histórico</span>'}</div>
    <div class="lt">Sedes</div>
    <div class="seg" role="tablist">
      <button class="${hoy?'on':''}" onclick="setFecha(todayStr())">Hoy</button>
      <button class="${ayer?'on':''}" onclick="setFecha(ayerStr())">Ayer</button>
      <button class="${(!hoy&&!ayer)?'on':''}" onclick="document.getElementById('fPick').showPicker?document.getElementById('fPick').showPicker():document.getElementById('fPick').focus()">Fecha</button>
    </div>
    <div class="datebox"><input type="date" id="fPick" value="${selDate}" max="${todayStr()}" onchange="setFecha(this.value)"></div>`;
}
async function renderSedes(showLoading){
  navSedes();
  const v=document.getElementById('view');
  if(showLoading) v.innerHTML='<div class="sect"><div class="hdr">Caja</div><div class="skel"></div><div class="skel" style="margin-top:6px"></div></div>';
  try{ await loadDia(); }catch(e){ v.innerHTML=`<div class="empty">No se pudo cargar: ${esc(e.message)}</div>`; return; }
  const sedes=sedesVisibles();
  const rows=sedes.map(s=>{ const ts=turnosDe(s); const c=ts[ts.length-1]||null; const di=difInfo(c);
    const sub=c?`Turno ${c.turno_num} · ventas ${fmt(c.total_ventas)} · efectivo ${fmt(c.efectivo)}`:'Sin turno abierto';
    return `<button class="cell ico" onclick="goDetalle('${esc(s)}')"><div class="ic" style="background:${SEDE_COLOR[s]}">${esc(s[0])}</div><div class="main"><span class="t">${esc(s)}</span><span class="s">${sub}</span></div>${c?(di?`<span class="pill ${di.cls}">${di.txt}</span>`:''):estadoPill(null)}<svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button>`; }).join('');
  const totV=cierres.reduce((m,c)=>{ m[c.sede]=Math.max(m[c.sede]||0,Number(c.total_ventas)||0); return m; },{});
  const sumV=Object.values(totV).reduce((a,b)=>a+b,0);
  const pend=[]; sedes.forEach(s=>{ const ts=turnosDe(s); const c=ts[ts.length-1]; if(!c) return;
    if(c.estado==='final'&&!c.sinpe_reporte) pend.push({s,t:'Cierre final sin reporte SINPE'});
    if(c.estado!=='abierto'&&!(c.inventario_cierre&&Object.keys(c.inventario_cierre).length)) pend.push({s,t:'Cierre sin conteo de inventario'});
    const inv=c.inventario_cierre||{}; const difs=Object.values(inv).filter(o=>o&&o.contado!=null&&Number(o.contado)!==Number(o.sistema)).length; if(difs) pend.push({s,t:`${difs} producto(s) con diferencia de inventario`}); });
  v.innerHTML=`
    <div class="tiles"><div class="tile"><span class="l">Ventas del día (sedes visibles)</span><span class="n num"><small>₡</small>${Math.round(sumV).toLocaleString('es-CR')}</span></div>
      <div class="tile"><span class="l">Turnos registrados</span><span class="n num">${cierres.filter(c=>sedes.includes(c.sede)).length}</span></div></div>
    <div class="sect"><div class="hdr">Caja por sede</div><div class="group">${rows||'<div class="cell"><span class="s">Sin sedes asignadas.</span></div>'}</div>
      <div class="ftr">${selDate===todayStr()?'Se actualiza cada 20 s mientras la app está abierta.':'Datos del cierre guardado ese día.'}</div></div>
    ${pend.length?`<div class="sect"><div class="hdr">Revisar</div><div class="group">${pend.map(p=>`<div class="cell"><div class="main"><span class="t">${esc(p.t)}</span><span class="s">${esc(p.s)}</span></div><span class="pill warn">Pendiente</span></div>`).join('')}</div></div>`:''}`;
}

// ── Render: Detalle de sede / turno ──
async function renderDetalle(showLoading){
  const v=document.getElementById('view');
  if(showLoading) v.innerHTML='<div class="sect"><div class="skel"></div></div>';
  try{ await loadDia(); }catch(e){ v.innerHTML=`<div class="empty">No se pudo cargar: ${esc(e.message)}</div>`; return; }
  const ts=turnosDe(detSede); let c=ts.find(x=>x.id===detTurnoId)||ts[ts.length-1]||null; detTurnoId=c?.id||null;
  document.getElementById('nav').innerHTML=`
    <div class="row"><button class="back" onclick="goSedes()"><svg viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Sedes</button><span class="tt">${c?('Turno '+c.turno_num):esc(detSede)}</span><button class="act" onclick="abrirCaja()">Caja</button></div>
    <div class="row"><span class="st">${esc(detSede)} · ${esc(fechaLarga(selDate))}</span>${c?estadoPill(c):estadoPill(null)}</div>
    ${ts.length>1?`<div class="seg">${ts.map(t=>`<button class="${t.id===c.id?'on':''}" onclick="detTurnoId='${t.id}';renderDetalle(false)">T${t.turno_num} · ${t.estado}</button>`).join('')}</div>`:''}`;
  if(!c){ v.innerHTML=`<div class="empty">No hay turnos de ${esc(detSede)} el ${esc(fechaLarga(selDate))}.</div>`; return; }
  const di=difInfo(c); const difAbs=Math.abs(Math.round(Number(c.diferencia)||0));
  const gastos=Array.isArray(c.gastos)?c.gastos:[]; const ingresos=Array.isArray(c.ingresos)?c.ingresos:[];
  const dep=gastos.filter(g=>g.cat==='deposito').reduce((s,g)=>s+(Number(g.monto)||0),0);
  const gReal=gastos.filter(g=>g.cat!=='deposito').reduce((s,g)=>s+(Number(g.monto)||0),0);
  const ing=ingresos.reduce((s,g)=>s+(Number(g.monto)||0),0);
  const sr=c.sinpe_reporte||null; let sinpeHtml='';
  if(sr){ const pa=Math.round(sr.pendAfter!=null?sr.pendAfter:((Number(sr.pendPrev)||0)+(Number(sr.nuevosMonto)||0)-(Number(sr.facturado)||0)));
    const pp=pa<0?{cls:'bad',txt:'Faltó '+fmt(-pa)}:pa===0?{cls:'ok',txt:'Cuadró'}:{cls:'info',txt:'Sobró '+fmt(pa)+' · por facturar'};
    sinpeHtml=`<div class="cell"><div class="main"><span class="t">Recibidos nuevos</span><span class="s">${esc(sr.fileName||'Reporte SINPE')} · ${sr.nuevosN||0} mov.</span></div><span class="v strong num">${fmt(sr.nuevosMonto)}</span></div>
      <div class="cell"><div class="main"><span class="t">Facturado</span></div><span class="v num">${fmt(sr.facturado)}</span></div>
      <div class="cell"><div class="main"><span class="t">Pendiente arrastrado</span></div><span class="v num">${fmt(sr.pendPrev)}</span></div>
      <div class="cell"><div class="main"><span class="t">Pendiente por facturar</span></div><span class="pill ${pp.cls}">${pp.txt}</span></div>`; }
  else sinpeHtml=`<div class="cell"><div class="main"><span class="t">Sin reporte SINPE</span><span class="s">${c.estado==='final'?'Obligatorio en el cierre final':'Se concilia en el cierre final'}</span></div><span class="pill ${c.estado==='final'?'warn':'status'}">${c.estado==='final'?'Falta':'Aún no'}</span></div>`;
  const inv=c.inventario_cierre||{}; const invKeys=Object.keys(inv); const invDifs=invKeys.filter(k=>inv[k]&&inv[k].contado!=null&&Number(inv[k].contado)!==Number(inv[k].sistema));
  let invHtml='';
  if(!invKeys.length) invHtml=`<div class="cell"><div class="main"><span class="t">Sin conteo de inventario</span><span class="s">Obligatorio en cada cierre</span></div><span class="pill ${c.estado==='abierto'?'status':'warn'}">${c.estado==='abierto'?'Aún no':'Falta'}</span></div>`;
  else if(!invDifs.length) invHtml=`<div class="cell"><div class="main"><span class="t">Conteo coincide con el sistema</span><span class="s">${invKeys.length} productos contados</span></div><span class="pill ok">✓ Cuadra</span></div>`;
  else invHtml=`<div class="cell"><div class="main"><span class="t">${invDifs.length} producto(s) con diferencia</span><span class="s">${invKeys.length} contados</span></div><span class="pill bad">Revisar</span></div>`+
    (esAdmin()?invDifs.slice(0,12).map(k=>`<div class="cell"><div class="main"><span class="t">${esc(k)}</span></div><span class="v num">contó ${inv[k].contado} · sistema ${inv[k].sistema}</span></div>`).join(''):`<div class="cell"><span class="s">Solo un administrador ve las cantidades del sistema.</span></div>`);
  const fa=c.foto_analisis||null;
  const reqs=[
    {ok:!!(c.foto_datafono||c.foto_cierre),t:'Foto datáfono'},
    {ok:!!invKeys.length,t:'Conteo inventario'},
    {ok:!!sr,t:'Reporte SINPE'},
    {ok:c.total_tarjeta!=null&&c.total_sinpe!=null,t:'Informe de Ventas'}];
  v.innerHTML=`
    <div class="tiles">
      <div class="tile"><span class="l">Ventas del día</span><span class="n num"><small>₡</small>${Math.round(Number(c.total_ventas)||0).toLocaleString('es-CR')}</span></div>
      <div class="tile"><span class="l">Efectivo contado</span><span class="n num"><small>₡</small>${Math.round(Number(c.efectivo)||0).toLocaleString('es-CR')}</span></div>
      <div class="tile wide"><div><span class="l">Diferencia</span><div class="n num" style="color:${di.cls==='ok'?'var(--green)':di.cls==='bad'?'var(--red)':'var(--blue)'}"><small>₡</small>${difAbs.toLocaleString('es-CR')}</div></div><span class="pill ${di.cls}">${di.txt}${di.cls==='bad'?' · de menos':di.cls==='info'?' · de más':''}</span></div>
    </div>
    <div class="sect"><div class="hdr">Ventas por método</div><div class="group">
      <div class="cell"><div class="main"><span class="t">Efectivo</span></div><span class="v num">${fmt((Number(c.total_ventas)||0)-(Number(c.total_tarjeta)||0)-(Number(c.total_sinpe)||0)-(Number(c.total_transferencia)||0))}</span></div>
      <div class="cell"><div class="main"><span class="t">Tarjeta</span>${fa&&fa.total_leido!=null?`<span class="s">Datáfono IA ${fmt(fa.total_leido)} ${fa.calza?'✓ calza':'⚠ difiere'}</span>`:''}</div><span class="v num">${fmt(c.total_tarjeta)}</span></div>
      <div class="cell"><div class="main"><span class="t">SINPE</span></div><span class="v num">${fmt(c.total_sinpe)}</span></div>
      <div class="cell"><div class="main"><span class="t">Transferencia</span></div><span class="v num">${fmt(c.total_transferencia)}</span></div></div>
      <div class="ftr">Caja inicial del turno ${fmt(c.caja_inicial)} · efectivo final ${fmt(c.efectivo_final??c.efectivo)}</div></div>
    <div class="sect"><div class="hdr">Movimientos de caja</div><div class="group">
      <div class="cell"><div class="main"><span class="t">Gastos</span><span class="s">${gastos.filter(g=>g.cat!=='deposito').length} pago(s) de caja</span></div><span class="v neg num">−${fmt(gReal)}</span></div>
      <div class="cell"><div class="main"><span class="t">Depósito al banco</span><span class="s">Sale de caja, no es gasto</span></div><span class="v num">${dep?'−'+fmt(dep):fmt(0)}</span></div>
      <div class="cell"><div class="main"><span class="t">Ingresos</span><span class="s">${ingresos.length?esc(ingresos.map(i=>i.desc).filter(Boolean).join(', ')):'Dinero que entró sin ser venta'}</span></div><span class="v ${ing?'pos':''} num">${ing?'+':''}${fmt(ing)}</span></div>
      <div class="cell"><div class="main"><span class="t">Sobre (minita)</span><span class="s">${c.sobre_modo==='ya'?'Ya retirado':c.sobre_modo==='no'?'No se sacaron sobres':'Se retira en el final'}</span></div><span class="v num">${fmt(c.minita)}</span></div></div></div>
    <div class="sect"><div class="hdr">SINPE del día</div><div class="group">${sinpeHtml}</div></div>
    <div class="sect"><div class="hdr">Inventario al cierre</div><div class="group">${invHtml}</div></div>
    <div class="sect"><div class="hdr">Requisitos del cierre</div><div class="chips">${reqs.map(r=>`<span class="pill ${r.ok?'ok':'warn'}">${r.ok?'✓':'○'} ${r.t}</span>`).join('')}</div></div>
    <div class="sect"><div class="hdr">Fotos</div><div class="group">
      ${c.foto_datafono?`<button class="cell" onclick="verFoto('${esc(c.foto_datafono)}','f1')"><div class="main"><span class="t">Foto datáfono (auditoría)</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button><div id="f1"></div>`:''}
      ${c.foto_cierre?`<button class="cell" onclick="verFoto('${esc(c.foto_cierre)}','f2')"><div class="main"><span class="t">Foto cierre de lote (final)</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button><div id="f2"></div>`:''}
      ${(!c.foto_datafono&&!c.foto_cierre)?'<div class="cell"><span class="s">Sin fotos todavía.</span></div>':''}</div></div>
    <div class="sect"><div class="group">
      <button class="cell" onclick="abrirCaja()"><div class="main"><span class="t" style="color:var(--brand-text)">Abrir Caja completa de ${esc(detSede)}</span><span class="s">Para editar, subir informes o cerrar</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button>
      <button class="cell" onclick="abrirModulo('/gastos')"><div class="main"><span class="t" style="color:var(--brand-text)">Abrir Gastos</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button></div>
      <div class="ftr">Actualizado ${c.updated_at?hora(c.updated_at):'—'}${c.created_by?' · abierto por '+esc(c.created_by):''}</div></div>`;
}
async function verFoto(path,boxId){
  const box=document.getElementById(boxId); if(!box) return; if(box.innerHTML){box.innerHTML='';return;}
  box.innerHTML='<div class="cell"><span class="s">Cargando foto…</span></div>';
  try{
    const res=await fetch(`${SUPA_URL}/storage/v1/object/sign/cierres-caja/${path}`,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+auth.access_token,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:600})});
    const d=await res.json(); if(!d.signedURL) throw new Error(d.message||'No se pudo firmar la URL');
    box.innerHTML=`<div class="foto"><img src="${SUPA_URL}/storage/v1${d.signedURL}" alt="Foto del cierre"></div>`;
  }catch(e){ box.innerHTML=`<div class="cell"><span class="s" style="color:var(--red)">${esc(e.message)}</span></div>`; }
}

// ── Salto a los módulos completos (misma sesión, vía handoff gymAuth como index.html) ──
function handoff(sede){ sessionStorage.setItem('gymAuth',JSON.stringify({token:auth.access_token,role:me.role,nombre:me.nombre||auth.email,email:auth.email,sede:sede||me.sede||null,sedes_extra:me.sedes_extra||[],user_id:auth.user_id})); }
function abrirCaja(){ handoff(detSede||me.sede); location.href='/caja'; }
function abrirModulo(p){ handoff(detSede||me.sede); location.href=p; }

// ── Render: Cuenta ──
function renderCuenta(){
  document.getElementById('nav').innerHTML=`<div class="row"><span class="st">Impulse Fit · v${APP_VER}</span></div><div class="lt">Cuenta</div>`;
  const sedes=sedesVisibles();
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  document.getElementById('view').innerHTML=`
    <div class="sect"><div class="group">
      <div class="cell"><div class="main"><span class="t">${esc(me?.nombre||auth?.email||'—')}</span><span class="s">${esc(auth?.email||'')}</span></div><span class="pill status">${esc(me?.role||'')}</span></div>
      <div class="cell"><div class="main"><span class="t">Sedes</span><span class="s">${esc(sedes.join(' · ')||'—')}</span></div></div></div></div>
    <div class="sect"><div class="hdr">En este iPhone</div><div class="group">
      <div class="cell"><div class="main"><span class="t">${standalone?'Instalada como app':'Abierta en Safari'}</span><span class="s">${standalone?'Se abre desde el icono de inicio.':'Compartir → "Agregar a pantalla de inicio" para tener el icono.'}</span></div><span class="pill ${standalone?'ok':'status'}">${standalone?'✓':'Safari'}</span></div>
      <button class="cell" onclick="location.reload()"><div class="main"><span class="t" style="color:var(--brand-text)">Recargar datos</span></div></button></div></div>
    <div class="sect"><div class="group"><button class="cell" onclick="doLogout()"><div class="main"><span class="t" style="color:var(--red)">Cerrar sesión</span></div></button></div>
      <div class="ftr">Cerrar sesión borra la sesión guardada en este teléfono.</div></div>`;
}

// ── Service worker (solo la carcasa; nunca datos de Supabase) ──
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }); }
boot();
