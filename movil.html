<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Impulse Fit</title>
<!-- PWA / iOS: mismo mecanismo que fittrainfitnessclub.wstudio.app (manifest + apple-touch-icon + web-app-capable) -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Impulse Fit">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --label:#000; --sec:rgba(60,60,67,.6); --ter:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29); --fill:rgba(120,120,128,.12);
    --glass:rgba(249,249,249,.8); --brand:#0E9F8E; --brand-text:#0B7F72; --brand-tint:rgba(14,159,142,.14);
    --green:#34C759; --red:#FF383C; --orange:#FF8D28; --blue:#0088FF;
    --green-tint:rgba(52,199,89,.16); --red-tint:rgba(255,56,60,.14); --orange-tint:rgba(255,141,40,.16); --blue-tint:rgba(0,136,255,.14);
    --status-fill:rgba(120,120,128,.16); --status-ink:rgba(60,60,67,.72);
    --indigo:#6155F5; --teal:#00C3D0; --purple:#CB30E0; --pinares:#2E7D32; --amber:#B9770E;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000; --card:#1C1C1E; --label:#fff; --sec:rgba(235,235,245,.6); --ter:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65); --fill:rgba(120,120,128,.24);
      --glass:rgba(30,30,30,.76); --brand:#2DBFAC; --brand-text:#3FD0BC; --brand-tint:rgba(45,191,172,.18);
      --green:#30D158; --red:#FF4245; --orange:#FF9230; --blue:#0091FF;
      --status-fill:rgba(120,120,128,.28); --status-ink:rgba(235,235,245,.72); --indigo:#6D7CFF; --teal:#00D2E0; --purple:#DB34F2; --pinares:#4CAF50; --amber:#D08A1F;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
  input{font:inherit}
  .num{font-variant-numeric:tabular-nums}

  /* ── Login ── */
  #login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);gap:14px;max-width:420px;margin:0 auto}
  #login .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 8px;display:block}
  #login h1{font-size:28px;font-weight:700;letter-spacing:-.02em;text-align:center;margin:0}
  #login p{margin:0 0 10px;text-align:center;color:var(--sec);font-size:15px}
  .field{background:var(--card);border-radius:12px;padding:0 16px;min-height:50px;display:flex;align-items:center}
  .field input{flex:1;border:0;background:transparent;color:var(--label);outline:none;min-height:50px;font-size:17px}
  .field input::placeholder{color:var(--ter)}
  .btn{min-height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;width:100%}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:disabled{opacity:.6}
  .err{color:var(--red);font-size:14px;min-height:18px;text-align:center}

  /* ── App shell ── */
  #app{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
  .nav{padding:calc(env(safe-area-inset-top) + 6px) 16px 8px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;background:var(--bg);z-index:3}
  .nav .row{display:flex;justify-content:space-between;align-items:center;min-height:32px;gap:10px}
  .nav .lt{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
  .nav .tt{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav .st{font-size:13px;color:var(--sec)}
  .nav .back{color:var(--brand-text);display:flex;align-items:center;gap:2px;min-height:44px;font-size:17px;flex:none}
  .nav .back svg{width:12px;height:20px}
  .nav .act{color:var(--brand-text);font-weight:600;min-height:44px;display:flex;align-items:center;flex:none}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
  .seg button{min-height:36px;border-radius:8px;font-size:14px;font-weight:600;color:var(--label);text-align:center}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .datebox input{width:100%;min-height:40px;border:0;border-radius:10px;background:var(--card);color:var(--label);padding:0 12px;font-size:16px}

  main{display:flex;flex-direction:column;gap:22px;padding-top:6px}
  .sect{display:flex;flex-direction:column;gap:6px}
  .sect .hdr{padding:0 32px;font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.04em}
  .sect .ftr{padding:0 32px;font-size:13px;color:var(--sec)}
  .group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
  .cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;width:100%}
  .cell + .cell::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
  .cell.ico + .cell.ico::before{left:58px}
  button.cell:active{background:var(--fill)}
  .cell .ic{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
  .cell .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .cell .t{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .s{font-size:13px;color:var(--sec)}
  .cell .v{font-size:17px;color:var(--sec);white-space:nowrap}
  .cell .v.strong{color:var(--label);font-weight:600}
  .cell .v.pos{color:var(--green)} .cell .v.neg{color:var(--red)}
  .chev{width:8px;height:14px;flex:none;stroke:var(--ter);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.ok{background:var(--green-tint);color:var(--green)} .pill.bad{background:var(--red-tint);color:var(--red)}
  .pill.warn{background:var(--orange-tint);color:var(--orange)} .pill.info{background:var(--blue-tint);color:var(--blue)}
  .pill.status{background:var(--status-fill);color:var(--status-ink)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .live .dot{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.live .dot{animation:none}}
  .tiles{margin:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .tile .l{font-size:13px;color:var(--sec)}
  .tile .n{font-size:22px;font-weight:700;letter-spacing:-.01em}
  .tile .n small{font-size:14px;font-weight:600;color:var(--sec);margin-right:2px}
  .tile.wide .n{font-size:26px}
  .chips{margin:0 16px;display:flex;flex-wrap:wrap;gap:8px}
  .empty{margin:0 16px;padding:28px 16px;text-align:center;color:var(--sec);font-size:15px;background:var(--card);border-radius:12px}
  .foto{margin:8px 16px 0;border-radius:12px;overflow:hidden;background:var(--card)}
  .foto img{display:block;width:100%;max-height:360px;object-fit:contain;background:#000}
  .skel{height:44px;margin:0 16px;border-radius:12px;background:var(--card);opacity:.6}
  .search{margin:0 16px}
  .search input{width:100%;min-height:40px;border:0;border-radius:10px;background:var(--card);color:var(--label);padding:0 12px;font-size:16px}

  /* ── Cards de sedes ── */
  .cards{margin:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
  .card:active{background:var(--fill)}
  .card .h{display:flex;align-items:center;gap:8px}
  .card .h .ic{width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;flex:none}
  .card .h .name{font-size:17px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .n{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
  .card .l{font-size:12px;color:var(--sec)}
  .card .f{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}

  /* ── Módulos de la sede (iconos de app, como en el concept) ── */
  .mods{margin:0 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
  .mod{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--label);text-align:center;min-height:44px}
  .mod .app{width:60px;height:60px;border-radius:14px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.12);position:relative}
  .mod .app svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .mod:active .app{transform:scale(.94)}
  .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}

  /* ── Tab bar flotante (Liquid Glass) ── */
  .tabbar{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 12px);height:64px;padding:6px;background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
    border:.5px solid var(--sep);border-radius:32px;box-shadow:0 10px 30px -6px rgba(0,0,0,.22);display:grid;grid-template-columns:1fr 1fr 1fr;z-index:5}
  .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--sec);border-radius:26px;min-height:44px;text-align:center}
  .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--brand-text);background:var(--brand-tint)}

  /* ── Botón de acción dentro de un módulo ── */
  .actionbar{margin:0 16px}
  .btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-right:8px}

  /* ── Hoja inferior (sheet) para capturar un envío ── */
  #sheet{position:fixed;inset:0;z-index:20}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
  .sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -12px 40px rgba(0,0,0,.25)}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;min-height:52px;border-bottom:.5px solid var(--sep)}
  .sheet-h .tt{font-size:17px;font-weight:600;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet-h .act{color:var(--brand-text);font-weight:600;min-height:44px;display:flex;align-items:center;flex:none}
  .sheet-h .act:disabled{opacity:.4}
  .sheet-body{overflow:auto;padding:12px 16px 16px}
  /* .hdr/.ftr están scopeados a .sect; dentro de una hoja también deben verse como texto secundario */
  .sheet-body .ftr{font-size:13px;color:var(--sec)}
  .sheet-body .hdr{font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.04em}
  .cell input.qty{width:76px;min-height:44px;border:0;border-radius:10px;background:var(--fill);color:var(--label);text-align:right;padding:0 10px;font-size:17px;font-weight:600;flex:none}
  .toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 90px);background:var(--label);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;text-align:center;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:.95}
  .btn.plain{background:var(--fill);color:var(--label)}
  .btn.plain svg{stroke:var(--label)}
  .pill.wrap{white-space:normal;height:auto;min-height:24px;padding:3px 9px;line-height:1.25;text-align:left}
  .foto img{cursor:zoom-in}
  .foto img.zoom{max-height:none;cursor:zoom-out}
</style>
</head>
<body>

<div id="login">
  <img class="logo" src="/icons/icon-192.png" alt="">
  <h1>Impulse Fit</h1>
  <p>Validación rápida por sede desde tu celular</p>
  <div class="field"><input id="lEmail" type="email" placeholder="Correo" autocomplete="username" inputmode="email" autocapitalize="none"></div>
  <div class="field"><input id="lPass" type="password" placeholder="Contraseña" autocomplete="current-password"></div>
  <div class="err" id="lErr"></div>
  <button class="btn primary" id="lBtn" onclick="doLogin()">Entrar</button>
  <p style="font-size:12px;margin-top:6px">La sesión queda guardada en este teléfono hasta que cierres sesión.</p>
</div>

<div id="app" hidden>
  <header class="nav" id="nav"></header>
  <main id="view"></main>
  <nav class="tabbar">
    <button class="tab on" id="tabSedes" onclick="goSedes()"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Sedes</button>
    <button class="tab" id="tabCierres" onclick="goCierresTab()"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Cierres</button>
    <button class="tab" id="tabCuenta" onclick="goCuenta()"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Cuenta</button>
  </nav>
</div>
<div id="sheet" hidden></div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL='__SUPA_URL__', SUPA_KEY='__SUPA_KEY__';
const APP_VER='2026-09-26a';
const SEDES=['3 Ríos','Natación','Pinares','Sabanilla'];
const SEDE_COLOR={'3 Ríos':'var(--teal)','Natación':'var(--blue)','Pinares':'var(--pinares)','Sabanilla':'var(--indigo)'};
const ROLES_PERMITIDOS=['recepcion','admin_sucursal','coordinador','admin_sedes','admin_g','admin'];
const AUTH_KEY='impulseMovilAuth';
const MESES_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CAT_GASTO={clases_grupales:'Clases grupales',instructores_planta:'Instructores de planta',staff:'Staff',parqueo:'Parqueo',mantenimiento:'Mantenimiento',otros:'Otros'};
const SEL_CIERRE=['id','sede','fecha','turno_num','estado','hora_apertura','hora_cierre','caja_inicial','efectivo','efectivo_final','total_ventas','total_tarjeta','total_sinpe','total_transferencia','total_gastos','total_ingresos','minita','otros_vendidos','diferencia','estado_dif','sobre_modo','gastos','ingresos','sinpe_reporte','inventario_cierre','foto_datafono','foto_cierre','foto_analisis','updated_at','created_by'].join(',');
const ICONS={
  caja:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M3 10h2M19 10h2"/></svg>',
  gastos:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>',
  inventario:'<svg viewBox="0 0 24 24"><path d="M3 8l9-4 9 4-9 4z"/><path d="M3 8v8l9 4 9-4V8"/><path d="M12 12v8"/></svg>',
  cierres:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  envios:'<svg viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>',
  proyecciones:'<svg viewBox="0 0 24 24"><path d="M4 18L10 11l4 4 6-8"/><path d="M15 7h5v5"/></svg>',
  arqueo:'<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8 13l3 3 5-6"/></svg>',
  mediciones:'<svg viewBox="0 0 24 24"><path d="M2 9h20v6H2z"/><path d="M6 9v3M10 9v4M14 9v3M18 9v4"/></svg>'
};
const MODS=[
  {id:'caja',label:'Caja',color:'var(--brand)'},
  {id:'gastos',label:'Gastos',color:'var(--orange)'},
  {id:'inventario',label:'Inventario',color:'var(--amber)'},
  {id:'arqueo',label:'Arqueo',color:'#FF2D55',arqueo:true},
  {id:'mediciones',label:'Mediciones',color:'var(--purple)',med:true},
  {id:'cierres',label:'Cierres',color:'var(--indigo)'},
  {id:'envios',label:'Envíos',color:'var(--teal)'},
  {id:'proyecciones',label:'Proyecciones',color:'var(--purple)',admin:true}
];
const modVisible=m=>m.arqueo?puedeArquear():m.med?puedeVerMed():(!m.admin||esAdmin());

// ── Helpers (van ANTES del estado: el estado inicial los usa) ──
const fmt=n=>'₡'+Math.round(Number(n)||0).toLocaleString('es-CR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr=()=>ymd(new Date());
const ayerStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return ymd(d);};
const mesOrdDe=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const mesLabel=o=>{const [y,m]=String(o).split('-').map(Number);return (MESES_ES[(m||1)-1]||'')+' '+y;};
const mesAnterior=o=>{const [y,m]=String(o).split('-').map(Number);const d=new Date(y,m-2,1);return mesOrdDe(d);};
const hora=iso=>iso?new Date(iso).toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'}):'—';
const fechaLarga=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-CR',{weekday:'long',day:'numeric',month:'long'}).replace(/^\w/,c=>c.toUpperCase());};
const fechaCorta=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('es-CR',{day:'numeric',month:'short'});};
const fechaDMY=s=>{const [y,m,d]=String(s).split('-').map(Number);return `${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`;};

// ── Estado ──
let auth=null, me=null;
let selDate=todayStr();                 // fecha para Caja / Sedes
let gMes=mesOrdDe(new Date());          // mes para Gastos
let cierres=[], ultimosFinales=[], invCache={}, invFiltro='';
let view='sedes', curMod=null, detSede=null, detTurnoId=null, pollTimer=null, navStack=[];
const esAdmin=()=>['admin','admin_sedes','admin_g'].includes(me?.role);
const puedeArquear=()=>esAdmin()||me?.role==='admin_sucursal';
// Recepción cuenta a ciegas; admins y coordinador ven la cantidad real del sistema.
const verInventarioReal=()=>esAdmin()||me?.role==='coordinador';
// Mediciones: recepción/coordinación agenda, el instructor solo marca la rutina.
const puedeAgendarMed=()=>esAdmin()||['recepcion','admin_sucursal','coordinador'].includes(me?.role);
const puedeRutinaMed=()=>esAdmin()||me?.role==='instructor';
const puedeVerMed=()=>puedeAgendarMed()||puedeRutinaMed();
let arq={rows:[],items:{},filtro:'',soloDif:false,saved:null}, arqVerId=null;
let audit={seg:'finales',rango:7,soloAlertas:false,rows:[]};

// ── Sesión persistente ──
function saveAuth(a){auth=a;try{localStorage.setItem(AUTH_KEY,JSON.stringify(a));}catch(_){}}
function clearAuth(){auth=null;me=null;try{localStorage.removeItem(AUTH_KEY);}catch(_){}}
async function supaFetch(path,opts={}){
  const res=await fetch(SUPA_URL+'/rest/v1'+path,{method:opts.method||'GET',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+(auth?.access_token||SUPA_KEY),'Content-Type':'application/json','Prefer':opts.prefer||'return=minimal'},body:opts.body!=null?JSON.stringify(opts.body):undefined});
  if(res.status===401&&auth?.refresh_token&&!opts._retry){ if(await refreshSession()) return supaFetch(path,{...opts,_retry:true}); }
  if(!res.ok){const t=await res.text();throw new Error(t||('HTTP '+res.status));} const txt=await res.text(); return txt?JSON.parse(txt):null;
}
async function refreshSession(){
  try{
    const res=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:auth.refresh_token})});
    const d=await res.json(); if(!d.access_token) return false;
    saveAuth({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,user_id:d.user?.id||auth.user_id,email:d.user?.email||auth.email}); return true;
  }catch(_){return false;}
}
async function loadMe(){
  const rows=await supaFetch(`/user_roles?id=eq.${auth.user_id}&select=role,nombre,sede,sedes_extra`);
  me=rows?.[0]||null;
  if(!me||!ROLES_PERMITIDOS.includes(me.role)) throw new Error('Su cuenta no tiene acceso a este módulo.');
}
async function doLogin(){
  const email=document.getElementById('lEmail').value.trim(), pwd=document.getElementById('lPass').value, err=document.getElementById('lErr'), btn=document.getElementById('lBtn');
  if(!email||!pwd){err.textContent='Complete correo y contraseña.';return;}
  btn.disabled=true;btn.textContent='Ingresando…';err.textContent='';
  try{
    const res=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pwd})});
    const d=await res.json(); if(!d.access_token) throw new Error(d.error_description||d.msg||'Credenciales incorrectas');
    saveAuth({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()+(d.expires_in||3600)*1000,user_id:d.user.id,email});
    await loadMe(); enterApp();
  }catch(e){clearAuth();err.textContent=e.message;}
  finally{btn.disabled=false;btn.textContent='Entrar';}
}
async function doLogout(){
  stopPoll();
  try{await fetch(`${SUPA_URL}/auth/v1/logout`,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+(auth?.access_token||'')}});}catch(_){}
  clearAuth(); document.getElementById('app').hidden=true; document.getElementById('login').hidden=false;
}
async function boot(){
  try{auth=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');}catch(_){auth=null;}
  if(auth?.refresh_token){
    const ok=await refreshSession();
    if(ok){ try{ await loadMe(); enterApp(); return; }catch(_){ } }
    clearAuth();
  }
  document.getElementById('login').hidden=false;
}
function enterApp(){ document.getElementById('login').hidden=true; document.getElementById('app').hidden=false; goSedes(); }

// ── Datos ──
async function loadDia(){ cierres=(await supaFetch(`/cierres_caja?fecha=eq.${selDate}&order=sede.asc,turno_num.asc&select=${SEL_CIERRE}`))||[]; }
async function loadUltimosFinales(){
  const rows=(await supaFetch(`/cierres_caja?estado=eq.final&order=fecha.desc,turno_num.desc&limit=60&select=${SEL_CIERRE}`))||[];
  const seen={}; ultimosFinales=[]; rows.forEach(c=>{ if(!seen[c.sede]){ seen[c.sede]=true; ultimosFinales.push(c); } });
}
async function loadInventario(sede){
  const rows=(await supaFetch(`/inventario?sede=eq.${encodeURIComponent(sede)}&activo=eq.true&order=producto.asc&select=id,producto,cantidad,cantidad_minima,precio,updated_at`))||[];
  invCache[sede]=rows; return rows;
}
const sedesVisibles=()=>{ if(esAdmin()) return SEDES; const set=[me?.sede,...(Array.isArray(me?.sedes_extra)?me.sedes_extra:[])].filter(s=>s&&SEDES.includes(s)); return [...new Set(set)]; };
const turnosDe=s=>cierres.filter(c=>c.sede===s).sort((a,b)=>(a.turno_num||0)-(b.turno_num||0));
const ultimoTurno=s=>{const ts=turnosDe(s);return ts[ts.length-1]||null;};
function difInfo(c){ if(!c) return null; const d=Math.round(Number(c.diferencia)||0); if(d===0) return {cls:'ok',txt:'Cuadra'}; if(d>0) return {cls:'bad',txt:'Faltante '+fmt(d)}; return {cls:'info',txt:'Sobrante '+fmt(-d)}; }
function estadoPill(c){ if(!c) return '<span class="pill warn">Sin turno</span>'; if(c.estado==='abierto') return '<span class="pill status live"><span class="dot"></span>Abierto '+hora(c.hora_apertura)+'</span>'; if(c.estado==='parcial') return '<span class="pill status">Parcial '+hora(c.hora_cierre)+'</span>'; return '<span class="pill status">Final '+hora(c.hora_cierre)+'</span>'; }
function sinpePill(c){ const sr=c?.sinpe_reporte; if(!sr) return null; const pa=Math.round(sr.pendAfter!=null?sr.pendAfter:((Number(sr.pendPrev)||0)+(Number(sr.nuevosMonto)||0)-(Number(sr.facturado)||0))); return pa<0?{cls:'bad',txt:'SINPE faltó '+fmt(-pa),pa}:pa===0?{cls:'ok',txt:'SINPE cuadró',pa}:{cls:'info',txt:'SINPE +'+fmt(pa)+' por facturar',pa}; }
// Alertas automáticas de un cierre (misma lógica para cards, hub y auditoría). prev = turno anterior del mismo día.
function prevDe(s,c){ if(!c) return null; return turnosDe(s).find(t=>t.turno_num===(c.turno_num||0)-1)||null; }
function alertasDe(c,prev){ const a=[]; if(!c) return a; const cerrado=c.estado!=='abierto';
  const d=Math.round(Number(c.diferencia)||0); if(cerrado&&d!==0) a.push({cls:d>0?'bad':'info',t:(d>0?'Faltante ':'Sobrante ')+fmt(Math.abs(d))});
  if(c.estado==='final'&&!c.sinpe_reporte) a.push({cls:'warn',t:'Sin reporte SINPE'});
  const sp=sinpePill(c); if(sp&&sp.pa<0) a.push({cls:'bad',t:'SINPE: facturó '+fmt(-sp.pa)+' más de lo recibido'});
  if(cerrado){ const inv=c.inventario_cierre||{}; const k=Object.keys(inv);
    if(!k.length) a.push({cls:'warn',t:'Sin conteo de inventario'});
    else { const n=k.filter(x=>inv[x]&&inv[x].contado!=null&&Number(inv[x].contado)!==Number(inv[x].sistema)).length; if(n) a.push({cls:'warn',t:n+' producto(s) con diferencia en el conteo'}); } }
  if(cerrado&&!(c.foto_datafono||c.foto_cierre)) a.push({cls:'warn',t:'Sin foto del datáfono'});
  if(cerrado&&(c.foto_datafono||c.foto_cierre)){ const st=estadoDatafono(c);
    if(st.k==='nocalza') a.push({cls:'bad',t:'Datáfono verificado: NO calza con tarjeta'});
    else if(st.k==='ia_no') a.push({cls:'warn',t:'Datáfono (IA) no calza con tarjeta'});
    else if(st.k==='pend'&&puedeArquear()) a.push({cls:'warn',t:'Datáfono sin verificar'}); }
  if(cerrado&&!(Number(c.total_ventas)>0)) a.push({cls:'warn',t:'Sin ventas cargadas'});
  if(prev){ const fin=Math.round(Number(prev.efectivo_final??prev.efectivo)||0), ini=Math.round(Number(c.caja_inicial)||0); if(fin!==ini) a.push({cls:'bad',t:'Fondo inicial '+fmt(ini)+' ≠ efectivo final del turno anterior '+fmt(fin)}); }
  return a; }
function pendientesDe(s){ const c=ultimoTurno(s); return alertasDe(c,prevDe(s,c)).map(a=>a.t); }

// ── Live (solo hoy, solo con la app visible) ──
function startPoll(){ stopPoll(); if(selDate!==todayStr()) return; pollTimer=setInterval(async()=>{ if(document.visibilityState!=='visible') return; try{ if(view==='sedes'){await loadDia();renderSedes(false);} else if(view==='hub'){await loadDia();renderHub(false);} else if(view==='mod'&&curMod==='caja'){await loadDia();renderCaja(false);} }catch(_){} },20000); }
function stopPoll(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible'||!auth) return;
  // No refrescar si hay trabajo en curso: un arqueo a medio contar o una hoja de envío abierta se perderían.
  if(view==='mod'&&(curMod==='arqueo'||curMod==='arqueoVer')) return; const sh=document.getElementById('sheet'); if(sh&&!sh.hidden) return;
  if(view==='sedes') renderSedes(true); else if(view==='hub') renderHub(true); else if(view==='mod') renderMod(true); else if(view==='cierresTab') renderCierresTab(true); });

// ── Navegación (pila de "atrás") ──
function setTabs(on){ ['sedes','cierres','cuenta'].forEach(k=>document.getElementById('tab'+k[0].toUpperCase()+k.slice(1)).classList.toggle('on',on===k)); }
async function goSedes(){ view='sedes'; navStack=[]; setTabs('sedes'); await renderSedes(true); startPoll(); window.scrollTo(0,0); }
async function goCierresTab(){ view='cierresTab'; navStack=[]; stopPoll(); setTabs('cierres'); await renderCierresTab(true); window.scrollTo(0,0); }
function goCuenta(){ view='cuenta'; navStack=[]; stopPoll(); setTabs('cuenta'); renderCuenta(); window.scrollTo(0,0); }
// Pila de "atrás": cada entrada lleva etiqueta y el rótulo del botón; no se apila dos veces seguidas la misma pantalla.
function pushBack(tag,fn,label){ const top=navStack[navStack.length-1]; if(top&&top.tag===tag) return; navStack.push({tag,fn,label}); }
const backLabel=()=>navStack[navStack.length-1]?.label||'Atrás';
const labelActual=()=>view==='mod'?(MODS.find(x=>x.id===curMod)?.label||'Atrás'):view==='hub'?(detSede||'Sede'):view==='cierresTab'?'Cierres':'Sedes';
async function goHub(sede,push){ if(push) pushBack(view+':'+(detSede||''),push,labelActual()); view='hub'; detSede=sede; setTabs('sedes'); await renderHub(true); startPoll(); window.scrollTo(0,0); }
async function goMod(mod,push){ if(push) pushBack(view+':'+(view==='mod'?curMod:detSede||''),push,labelActual()); view='mod'; curMod=mod; await renderMod(true); startPoll(); window.scrollTo(0,0); }
function back(){ const e=navStack.pop(); if(e&&e.fn) e.fn(); else goSedes(); }
function setFecha(f){ if(!f) return; selDate=f; if(view==='mod'&&curMod==='caja') renderCaja(true); else if(view==='hub') renderHub(true); else renderSedes(true); startPoll(); }
function abrirCierreFinal(id){ const c=ultimosFinales.find(x=>x.id===id); if(!c) return; selDate=c.fecha; detSede=c.sede; detTurnoId=c.id; goMod('caja',goCierresTab); }
function abrirCierreHist(sede,fecha,id){ selDate=fecha; detSede=sede; detTurnoId=id; goMod('caja',()=>goMod('cierres')); }

// ── Sedes (cards) ──
function segFecha(){ const hoy=selDate===todayStr(), ayer=selDate===ayerStr();
  return `<div class="seg" role="tablist"><button class="${hoy?'on':''}" onclick="setFecha(todayStr())">Hoy</button><button class="${ayer?'on':''}" onclick="setFecha(ayerStr())">Ayer</button><button class="${(!hoy&&!ayer)?'on':''}" onclick="const p=document.getElementById('fPick');p.showPicker?p.showPicker():p.focus()">Fecha</button></div>
    <div class="datebox"><input type="date" id="fPick" value="${selDate}" max="${todayStr()}" onchange="setFecha(this.value)"></div>`; }
async function renderSedes(showLoading){
  const hoy=selDate===todayStr();
  document.getElementById('nav').innerHTML=`<div class="row"><span class="st">${esc(fechaLarga(selDate))}</span>${hoy?'<span class="pill ok live"><span class="dot"></span>En vivo</span>':'<span class="pill status">Histórico</span>'}</div><div class="lt">Sedes</div>${segFecha()}`;
  const v=document.getElementById('view');
  if(showLoading) v.innerHTML='<div class="cards"><div class="skel" style="margin:0;height:150px"></div><div class="skel" style="margin:0;height:150px"></div><div class="skel" style="margin:0;height:150px"></div><div class="skel" style="margin:0;height:150px"></div></div>';
  try{ await loadDia(); }catch(e){ v.innerHTML=`<div class="empty">No se pudo cargar: ${esc(e.message)}</div>`; return; }
  const sedes=sedesVisibles();
  const cards=sedes.map(s=>{ const c=ultimoTurno(s); const di=difInfo(c); const np=pendientesDe(s).length;
    return `<button class="card" style="--c:${SEDE_COLOR[s]}" onclick="goHub('${esc(s)}',goSedes)">
      <div class="h"><span class="ic">${esc(s[0])}</span><span class="name">${esc(s)}</span></div>
      <div><div class="n num">${c?fmt(c.total_ventas):'—'}</div><div class="l">${c?('Ventas · turno '+c.turno_num):'Sin turno abierto'}</div></div>
      ${c?`<div class="l num">Efectivo ${fmt(c.efectivo)}</div>`:''}
      <div class="f">${estadoPill(c)}${di?`<span class="pill ${di.cls}">${di.txt}</span>`:''}${np?`<span class="pill warn">${np} por revisar</span>`:''}</div>
    </button>`; }).join('');
  const totV=cierres.reduce((m,c)=>{ m[c.sede]=Math.max(m[c.sede]||0,Number(c.total_ventas)||0); return m; },{});
  const sumV=Object.values(totV).reduce((a,b)=>a+b,0);
  v.innerHTML=`<div class="cards">${cards||'<div class="empty" style="grid-column:1/-1;margin:0">Sin sedes asignadas.</div>'}</div>
    <div class="tiles"><div class="tile"><span class="l">Ventas del día</span><span class="n num"><small>₡</small>${Math.round(sumV).toLocaleString('es-CR')}</span></div><div class="tile"><span class="l">Turnos registrados</span><span class="n num">${cierres.filter(c=>sedes.includes(c.sede)).length}</span></div></div>
    <div class="sect"><div class="ftr" style="text-align:center">${hoy?'Tocá una sede para ver sus módulos. Se actualiza cada 20 s.':'Datos guardados de ese día.'}</div></div>`;

// ── Hub de la sede: resumen + módulos filtrados a esa sede ──
async function renderHub(showLoading){
  const s=detSede;
  document.getElementById('nav').innerHTML=`<div class="row"><button class="back" onclick="back()"><svg viewBox="0 0 12 20"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(backLabel())}</button><span class="tt">${esc(s)}</span><button class="act" onclick="abrirCaja()">Abrir caja</button></div><div class="row"><span class="st">${esc(fechaLarga(selDate))}</span><span id="hubEstado"></span></div>`;
  const v=document.getElementById('view');
  if(showLoading) v.innerHTML='<div class="tiles"><div class="skel" style="margin:0;height:70px"></div><div class="skel" style="margin:0;height:70px"></div></div><div class="mods">'+'<div class="skel" style="margin:0;width:60px;height:60px;border-radius:14px"></div>'.repeat(4)+'</div>';
  const [r1,r2,r3]=await Promise.allSettled([loadDia(), supaFetch(`/envios_mercaderia?sede=eq.${encodeURIComponent(s)}&estado=eq.pendiente&select=id`), invCache[s]?Promise.resolve(invCache[s]):loadInventario(s)]);
  if(r1.status==='rejected'){ v.innerHTML=`<div class="empty">No se pudo cargar: ${esc(r1.reason?.message||'error')}</div>`; return; }
  const c=ultimoTurno(s); const di=difInfo(c);
  const nEnv=r2.status==='fulfilled'?(r2.value||[]).length:0;
  const inv=r3.status==='fulfilled'?(r3.value||[]):[]; const nBajo=inv.filter(r=>Number(r.cantidad)<Number(r.cantidad_minima||0)).length;
  const pend=pendientesDe(s);
  const badges={caja:pend.length,inventario:nBajo,envios:nEnv};
  const est=document.getElementById('hubEstado'); if(est) est.innerHTML=estadoPill(c);
  const mods=MODS.filter(modVisible).map(m=>`<button class="mod" onclick="goMod('${m.id}',()=>goHub('${esc(s)}'))"><span class="app" style="background:${m.color}">${ICONS[m.id]}${badges[m.id]?`<span class="badge">${badges[m.id]}</span>`:''}</span>${m.label}</button>`).join('');
  v.innerHTML=`
    <div class="tiles">
      <div class="tile"><span class="l">Ventas del día</span><span class="n num">${c?fmt(c.total_ventas):'—'}</span></div>
      <div class="tile"><span class="l">Efectivo contado</span><span class="n num">${c?fmt(c.efectivo):'—'}</span></div>
      <div class="tile wide"><div><span class="l">Diferencia de caja</span><div class="n num" style="color:${!di?'var(--sec)':di.cls==='ok'?'var(--green)':di.cls==='bad'?'var(--red)':'var(--blue)'}">${c?fmt(Math.abs(Math.round(Number(c.diferencia)||0))):'—'}</div></div>${di?`<span class="pill ${di.cls}">${di.txt}</span>`:'<span class="pill warn">Sin turno</span>'}</div>
    </div>
    <div class="sect"><div class="hdr">Módulos de ${esc(s)}</div><div class="mods">${mods}</div></div>
    ${pend.length||nBajo||nEnv?`<div class="sect"><div class="hdr">Revisar</div><div class="group">
      ${pend.map(t=>`<button class="cell" onclick="goMod('caja',()=>goHub('${esc(s)}'))"><div class="main"><span class="t">${esc(t)}</span><span class="s">Caja · turno ${c?c.turno_num:''}</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button>`).join('')}
      ${nBajo?`<button class="cell" onclick="goMod('inventario',()=>goHub('${esc(s)}'))"><div class="main"><span class="t">${nBajo} producto(s) bajo mínimo</span><span class="s">Inventario</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button>`:''}
      ${nEnv?`<button class="cell" onclick="goMod('envios',()=>goHub('${esc(s)}'))"><div class="main"><span class="t">${nEnv} envío(s) por aceptar</span><span class="s">Envíos de mercadería</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button>`:''}
    </div></div>`:`<div class="sect"><div class="ftr" style="text-align:center">Nada pendiente por revisar en ${esc(s)}.</div></div>`}`;
}

/* ══ Mediciones: agenda del día, solo lunes a viernes ══
   Espacios de 15 min · mañana 08:00–10:45 · tarde 17:00–19:45. */
const MED_AM=[], MED_PM=[];
for(let m=8*60;  m<=10*60+45; m+=15) MED_AM.push(m);
for(let m=17*60; m<=19*60+45; m+=15) MED_PM.push(m);
const MED_SLOTS=MED_AM.length+MED_PM.length;
const MED_DIAS=['lunes','martes','miércoles','jueves','viernes'];
const medHH=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const medDow=s=>{const [y,m,d]=String(s).split('-').map(Number);return (new Date(y,m-1,d).getDay()+6)%7;};
const medSuma=(s,n)=>{const [y,m,d]=String(s).split('-').map(Number);const x=new Date(y,m-1,d);x.setDate(x.getDate()+n);return ymd(x);};
function medHabil(f,dir){ let g=0; while(medDow(f)>4 && g++<7) f=medSuma(f,dir||1); return f; }   // salta sábado y domingo
let medFecha=medHabil(todayStr()), medRows=[], medSeq=0, medBloq={};   // medBloq: 'HH:MM' → bloqueo del día mostrado
function medSetFecha(f){ if(!f) return; medFecha=medHabil(f); renderMedicionesMod(); }
function medMover(n){ medFecha=medHabil(medSuma(medFecha,n), n>0?1:-1); renderMedicionesMod(); }
const medPill=r=>r==='completa'?'<span class="pill ok">✓ Completa</span>'
               :r==='incompleta'?'<span class="pill bad">✗ Incompleta</span>'
               :'<span class="pill status">Pendiente</span>';

async function renderMedicionesMod(){
  const hoy=medHabil(todayStr()), esHoy=medFecha===hoy;
  navMod('Mediciones',
    `<div class="row"><span class="st">${esc(fechaLarga(medFecha))} · ${esc(detSede)}</span></div>
     <div class="seg"><button onclick="medMover(-1)">‹</button><button class="${esHoy?'on':''}" onclick="medSetFecha('${hoy}')">Hoy</button><button onclick="medMover(1)">›</button></div>
     <div class="datebox"><input type="date" id="medPick" value="${medFecha}" onchange="medSetFecha(this.value)"></div>`,
    '<button class="act" onclick="abrirMediciones()">Semana</button>');
  const v=document.getElementById('view');
  v.innerHTML='<div class="sect"><div class="skel"></div><div class="skel" style="margin-top:6px"></div></div>';
  const seq=++medSeq, sedeQ=encodeURIComponent(detSede), dow=medDow(medFecha);
  try{
    const [rows,blos]=await Promise.all([
      supaFetch(`/mediciones?sede=eq.${sedeQ}&fecha=eq.${medFecha}&order=hora.asc&select=*`),
      // Bloqueos que aplican a este día: el permanente de su día de la semana, o el de esta fecha
      supaFetch(`/mediciones_bloqueos?sede=eq.${sedeQ}&or=(and(tipo.eq.permanente,dia_semana.eq.${dow}),and(tipo.eq.unico,fecha.eq.${medFecha}))&select=*`).catch(()=>[])
    ]);
    medRows=rows||[];

  if(seq!==medSeq) return;
  const by={}; medRows.forEach(r=>{ by[String(r.hora||'').slice(0,5)]=r; });
  const comp=medRows.filter(r=>r.rutina==='completa').length, inc=medRows.filter(r=>r.rutina==='incompleta').length;

      : `<div class="cell"><span class="v num" style="width:44px;flex:none">${h}</span><div class="main"><span class="t" style="color:var(--ter)">Libre</span></div></div>`;
  };
  v.innerHTML=`
    <div class="tiles">
      <div class="tile"><span class="l">Agendadas</span><span class="n num">${medRows.length}</span></div>
      <div class="tile"><span class="l">Libres</span><span class="n num">${MED_SLOTS-medRows.length-nBloq}</span></div>
      <div class="tile"><span class="l">Completas</span><span class="n num" style="color:var(--green)">${comp}</span></div>
      <div class="tile"><span class="l">Incompletas</span><span class="n num" style="color:var(--red)">${inc}</span></div>
    </div>

      <div class="ftr">${puedeRutinaMed()&&!puedeAgendarMed()?'Como instructor solo podés marcar la rutina.':'La rutina (completa / incompleta) la marca el instructor.'} Sábado y domingo no hay medición.</div></div>`;
}

async function medGuardar(id){

             agendado_por:auth.email||null, agendado_por_nombre:me.nombre||auth.email||null}});

// Estado de verificación del datáfono: manual (persona) manda sobre la IA.
function estadoDatafono(c){ const fa=c.foto_analisis||{}; const m=fa.manual||null; const tieneFoto=!!(c.foto_datafono||c.foto_cierre);
  if(!tieneFoto) return {k:'sinfoto',cls:'warn',t:'Sin foto del datáfono'};
  if(m&&m.calza===true) return {k:'ok',cls:'ok',t:'Verificado: calza'+(m.monto_leido!=null?' · voucher '+fmt(m.monto_leido):'')};
  if(m&&m.calza===false) return {k:'nocalza',cls:'bad',t:'Verificado: NO calza'+(m.monto_leido!=null?' · voucher '+fmt(m.monto_leido):'')};
  if(fa.calza===true&&fa.total_leido!=null) return {k:'ok',cls:'ok',t:'IA: calza · leyó '+fmt(fa.total_leido)};

      ${sinDf?`<div class="tile wide"><span class="l">Datáfonos sin verificar (foto vs tarjeta)</span><span class="pill warn">${sinDf}</span></div>`:''}
      ${dfNo?`<div class="tile wide"><span class="l">Datáfonos que NO calzan</span><span class="pill bad">${dfNo}</span></div>`:''}
    </div>
    ${fechas.length?fechas.map(f=>`<div class="sect"><div class="hdr">${esc(fechaLarga(f))}${f===todayStr()?' · hoy':f===ayerStr()?' · ayer':''}</div><div class="group">${porFecha[f].sort((a,b)=>a.sede.localeCompare(b.sede)||(b.turno_num||0)-(a.turno_num||0)).map(c=>`<button class="cell ico" onclick="abrirCierreAudit('${c.id}')"><div class="ic" style="background:${SEDE_COLOR[c.sede]||'var(--sec)'}">${esc(c.sede[0])}</div><div class="main"><span class="t">${esc(c.sede)} · T${c.turno_num} · ${c.estado}</span><span class="s num">Ventas ${fmt(c.total_ventas)} · efectivo ${fmt(c.efectivo)}${c.hora_cierre?' · '+hora(c.hora_cierre):''}</span><span class="s" style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">${c._al.length?c._al.slice(0,3).map(a=>`<span class="pill wrap ${a.cls}">${esc(a.t)}</span>`).join('')+(c._al.length>3?`<span class="pill status">+${c._al.length-3}</span>`:''):'<span class="pill ok">✓ Sin alertas</span>'}</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button>`).join('')}</div></div>`).join('')

const difBadge=d=>d==null?'':d===0?'<span class="pill ok" style="height:20px">✓ igual</span>':`<span class="pill ${d<0?'bad':'info'}" style="height:20px">${d>0?'+':''}${d}</span>`;
function arqStats(){ const it=arq.items; let contados=0,conDif=0,uDif=0,vDif=0; arq.rows.forEach(r=>{ const c=it[r.producto]; if(c==null) return; contados++; const d=c-(Number(r.cantidad)||0); if(d!==0){conDif++;uDif+=d;vDif+=d*(Number(r.precio)||0);} }); return {contados,conDif,uDif,vDif,total:arq.rows.length}; }
function arqTilesHtml(st){ return `<div class="tile"><span class="l">Contados</span><span class="n num">${st.contados}<small style="margin-left:4px">/ ${st.total}</small></span></div><div class="tile"><span class="l">Con diferencia</span><span class="n num" style="color:${st.conDif?'var(--red)':'var(--green)'}">${st.conDif}</span></div><div class="tile wide"><div><span class="l">Diferencia neta</span><div class="n num" style="color:${st.uDif<0?'var(--red)':st.uDif>0?'var(--blue)':'var(--green)'}">${st.uDif>0?'+':''}${st.uDif} u</div></div><span class="pill ${st.vDif<0?'bad':st.vDif>0?'info':'ok'}">${st.vDif<0?'−':st.vDif>0?'+':''}${fmt(Math.abs(st.vDif))}</span></div>`; }
function arqProgreso(st){ const p=document.getElementById('arqProg'); if(p) p.textContent=`${st.contados} de ${st.total} contados`; const b=document.getElementById('btnArqGuardar'); if(b) b.disabled=!st.contados; }

function pintarArqueo(){

  const lista=arq.rows.map((r,i)=>({r,i})).filter(({r})=>(!f||String(r.producto).toLowerCase().includes(f))&&(!arq.soloDif||(arq.items[r.producto]!=null&&arq.items[r.producto]!==(Number(r.cantidad)||0))));

    <div class="actionbar"><div class="seg"><button class="${!arq.soloDif?'on':''}" onclick="arq.soloDif=false;pintarArqueo()">Todos</button><button class="${arq.soloDif?'on':''}" onclick="arq.soloDif=true;pintarArqueo()">Solo con diferencia</button></div></div>

      <div class="ftr">Contá lo que hay físicamente. Podés hacer un arqueo parcial: lo no contado no se toma en cuenta. Al guardar queda registrado para auditoría; el stock del sistema no cambia hasta que lo apliques.</div></div>`;

function arqInput(i,val){ const r=arq.rows[i]; if(!r) return; const v=val===''?null:Math.max(0,Math.floor(Number(val)||0)); arq.items[r.producto]=v; const sis=Number(r.cantidad)||0; const el=document.getElementById('arqDif_'+i); if(el) el.innerHTML=difBadge(v==null?null:v-sis); const st=arqStats(); const t=document.getElementById('arqTiles'); if(t) t.innerHTML=arqTilesHtml(st); arqProgreso(st); }
async function guardarArqueo(){
  const st=arqStats(); if(!st.contados) return; const b=document.getElementById('btnArqGuardar'); b.disabled=true; b.textContent='Guardando…';
  const items={}; arq.rows.forEach(r=>{ const c=arq.items[r.producto]; if(c==null) return; const sis=Number(r.cantidad)||0; items[r.producto]={id:r.id,sistema:sis,contado:c,dif:c-sis,precio:Number(r.precio)||0}; });
  try{
    const res=await supaFetch('/arqueos_inventario',{method:'POST',prefer:'return=representation',body:{sede:detSede,fecha:todayStr(),items,productos:st.total,contados:st.contados,con_diferencia:st.conDif,unidades_dif:st.uDif,valor_dif:st.vDif,ajustado:false,created_by:auth.email||null}});
    arq.saved=Array.isArray(res)?res[0]:res; renderArqueoResultado();
  }catch(e){ b.disabled=false; b.textContent='Guardar'; toast('No se pudo guardar: '+(/arqueos_inventario/.test(e.message)&&/relation|exist|schema cache/i.test(e.message)?'falta correr arqueos.sql en Supabase':e.message)); }

function renderArqueoResultado(){

    <div class="actionbar"><button class="btn plain" onclick="invCache[detSede]=null;back()">Volver</button></div>`;
}
async function aplicarArqueo(){
  const difs=arq.rows.filter(r=>arq.items[r.producto]!=null&&arq.items[r.producto]!==(Number(r.cantidad)||0));
  if(!difs.length) return; if(!confirm(`¿Reemplazar la cantidad del sistema por lo contado en ${difs.length} producto(s)? Queda registrado en el arqueo.`)) return;
  const b=document.getElementById('btnAplicar'); b.disabled=true; b.textContent='Aplicando…'; let ok=0, err=null;
  for(const r of difs){ try{ await supaFetch(`/inventario?id=eq.${r.id}`,{method:'PATCH',body:{cantidad:arq.items[r.producto],updated_at:new Date().toISOString()}}); ok++; }catch(e){ err=e; } }
  try{ if(arq.saved?.id) await supaFetch(`/arqueos_inventario?id=eq.${arq.saved.id}`,{method:'PATCH',body:{ajustado:true}}); }catch(_){}
  invCache[detSede]=null; toast(err?`Se aplicaron ${ok} de ${difs.length}. Error: ${err.message}`:`Inventario actualizado: ${ok} producto(s).`); back();
}

  sh.innerHTML=`<div class="sheet-bg" onclick="cerrarSheet()"></div>
    <div class="sheet-panel" role="dialog" aria-label="Sedes de usuarios">
      <div class="sheet-h"><button class="act plain" onclick="cerrarSheet()">Cerrar</button>
        <span class="tt">🏢🔀 Sedes de usuarios</span><span class="act" style="visibility:hidden">·</span></div>
      <div class="sheet-body"><div class="ftr" style="padding:0 0 10px">Cargando usuarios…</div></div>
    </div>`;
  sh.hidden=false; document.body.style.overflow='hidden';
  try{
    _suUsers=(await supaFetch(`/user_roles?role=in.(${ROLES_CON_SEDE_EXTRA})&select=id,nombre,role,sede,sedes_extra&order=nombre.asc`))||[];
  }catch(e){
    sh.querySelector('.sheet-body').innerHTML=`<div class="empty" style="margin:0">No se pudieron cargar los usuarios: ${esc(e.message)}</div>`; return;
  }
  suListaUsuarios();
}

function suListaUsuarios(){
  _suSel=null;
  const body=document.querySelector('#sheet .sheet-body'); if(!body) return;
  if(!_suUsers.length){ body.innerHTML='<div class="empty" style="margin:0">No hay usuarios con sede asignada.</div>'; return; }
  body.innerHTML=`<div class="ftr" style="padding:0 0 10px">Elegí a quién querés habilitarle otra sede.</div>
    <div class="group" style="margin:0">${_suUsers.map((u,i)=>{
      const extra=Array.isArray(u.sedes_extra)?u.sedes_extra.filter(Boolean):[];
      return `<button class="cell" onclick="suAbrirUsuario(${i})">
        <div class="main"><span class="t">${esc(u.nombre||'(sin nombre)')}</span>
          <span class="s">${esc(u.role||'')} · ${esc(u.sede||'sin sede')}${extra.length?' + '+esc(extra.join(', ')):''}</span></div>
        ${extra.length?`<span class="pill info">+${extra.length}</span>`:''}
        <svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button>`;}).join('')}</div>`;
}

function suAbrirUsuario(i){
  const u=_suUsers[i]; if(!u) return; _suSel=u;
  const extra=Array.isArray(u.sedes_extra)?u.sedes_extra:[];
  const sh=document.getElementById('sheet');
  sh.querySelector('.sheet-h').innerHTML=`<button class="act plain" onclick="suListaUsuarios()">Atrás</button>
    <span class="tt">${esc(u.nombre||'Usuario')}</span>
    <button class="act" id="suSave" onclick="suGuardar()">Guardar</button>`;
  sh.querySelector('.sheet-body').innerHTML=`
    <div class="ftr" style="padding:0 0 10px">${esc(u.role||'')} · sede principal <b>${esc(u.sede||'—')}</b></div>
    <div class="group" style="margin:0">${SEDES.map(s=>{
      const principal=(s===u.sede), marcada=principal||extra.includes(s);
      return `<label class="cell" style="cursor:${principal?'default':'pointer'};${principal?'opacity:.6':''}">
        <input type="checkbox" value="${esc(s)}" ${marcada?'checked':''} ${principal?'disabled':''}
          style="width:22px;height:22px;flex:none;accent-color:var(--brand);margin:0 4px 0 0;">
        <div class="main"><span class="t">${esc(s)}</span></div>
        ${principal?'<span class="pill status">principal</span>':''}</label>`;}).join('')}</div>
    <div class="ftr" id="suMsg" style="padding:10px 0 0">La sede principal siempre queda marcada. Al guardar, la persona debe cerrar sesión y volver a entrar.</div>`;
}

async function suGuardar(){
  const u=_suSel; if(!u) return;
  const btn=document.getElementById('suSave'), msg=document.getElementById('suMsg');
  const extra=[...document.querySelectorAll('#sheet input[type=checkbox]:checked')].map(c=>c.value).filter(s=>s!==u.sede);
  btn.disabled=true; btn.textContent='Guardando…';
  try{
    await supaFetch('/rpc/set_user_sedes',{method:'POST',body:{p_id:u.id,p_extra:extra}});
    u.sedes_extra=extra;
    cerrarSheet();
    toast(extra.length ? `${u.nombre||'Usuario'} ahora también puede: ${extra.join(', ')}`
                       : `${u.nombre||'Usuario'}: solo ${u.sede}`);
  }catch(e){
    btn.disabled=false; btn.textContent='Guardar';
    if(msg){ msg.style.color='var(--red)'; msg.textContent='⚠ '+e.message; }
  }
}

// ── Service worker (solo la carcasa; nunca datos de Supabase) ──
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }); }
boot();
</script>
